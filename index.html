<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Official Social Links | BOS & AOPAY</title>
  <meta name="description" content="Official social media links for BOS Center Pvt. Ltd. and AOPAY Technology Pvt. Ltd." />
  <link rel="stylesheet" href="assets/css/styles.css" />

</head>

<body>
  <div class="bg" aria-hidden="true">
    <video autoplay muted loop playsinline preload="auto">
      <source src="https://aopay.in/assets/Home/homeBG.mp4" type="video/mp4" />
    </video>
  </div>

  <div class="mist" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <div class="topbar">
    <div class="mini-brand">
      <span class="spark" aria-hidden="true"></span>
      <small>Official Social Links — BOS & AOPAY</small>
    </div>

    <div class="actions">
      <button class="btn" id="copyBtn" type="button">Copy Page Link</button>
      <button class="btn" id="shareBtn" type="button">Share</button>
    </div>
  </div>

  <main class="wrap">
    <section class="grid" aria-label="Company social links">

      <article class="company" data-brand="bos">
        <div class="accent-line" aria-hidden="true"></div>

        <div class="head">
          <div class="left">
            <div class="logo" title="BOS Center Private Limited">
              <img src="https://bos.center/assets/logo.png" alt="BOS Center Private Limited Logo">
            </div>
            <div class="title">
              <h2>BOS Center Private Limited</h2>
              <small>Official social channels</small>
            </div>
          </div>
        </div>

        <div class="body">
          <div class="lineTitle">
            <span>Follow us here</span><div class="rule"></div>
          </div>
          <div class="socials" id="bosSocials"></div>
        </div>
      </article>

      <article class="company" data-brand="aopay">
        <div class="accent-line" aria-hidden="true"></div>

        <div class="head">
          <div class="left">
            <div class="logo" title="AOPAY Technology Private Limited">
              <img src="https://aopay.in/assets/Home/logo.png" alt="AOPAY Technology Private Limited Logo">
            </div>
            <div class="title">
              <h2>AOPAY Technology Private Limited</h2>
              <small>Official social channels</small>
            </div>
          </div>
        </div>

        <div class="body">
          <div class="lineTitle">
            <span>Stay updated</span><div class="rule"></div>
          </div>
          <div class="socials" id="aopaySocials"></div>
        </div>
      </article>

    </section>
  </main>

  <div class="footer">
    <span>© <span id="year"></span> BOS Center Pvt. Ltd. & AOPAY Technology Pvt. Ltd.</span>
    <span>Use only these official links.</span>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

   <script defer src="assets/js/app.js"></script>
</body>
</html>
